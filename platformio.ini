; PlatformIO build for SX1281_QO100_TX (the Arduino IDE build works as before)
; Arduino core 2.x is required: the code uses ledcSetup / ledcWriteTone(channel, ...)

[platformio]
src_dir = .
data_dir = data

[env:esp32dev]
platform = espressif32@6.9.0        ; Arduino-ESP32 core 2.0.17
board = esp32dev
framework = arduino
board_build.filesystem = spiffs
monitor_speed = 115200
build_src_filter = +<*> -<hw/> -<data/> -<img/> -<.git/> -<pyCWdclient/>
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    https://github.com/StuartsProjects/SX12XX-LoRa.git
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP

; Over-the-air upload through the keyer's /ota endpoint (firmware and web files):
;   KEYER_APIKEY=xxxx pio run -e ota -t upload --upload-port 192.168.1.118
;   KEYER_APIKEY=xxxx pio run -e ota -t uploadfs --upload-port 192.168.1.118
; The keyer picks the SPIFFS partition from the file name (spiffs.bin).
[env:ota]
extends = env:esp32dev
upload_protocol = custom
upload_command = curl -sS --fail-with-body -F "file=@$SOURCE" "http://$UPLOAD_PORT/ota?apikey=$${KEYER_APIKEY}"
