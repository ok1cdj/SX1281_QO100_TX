; PlatformIO build for SX1281_QO100_TX (added, not part of upstream)
; Arduino core 2.x is required: the code uses ledcSetup / ledcWriteTone(channel, ...)

[platformio]
src_dir = .
data_dir = data

[env:esp32dev]
platform = espressif32@6.9.0        ; Arduino-ESP32 core 2.0.17
board = esp32dev
framework = arduino
board_build.filesystem = spiffs
monitor_speed = 115200
build_src_filter = +<*> -<hw/> -<data/> -<img/> -<.git/>
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    https://github.com/StuartsProjects/SX12XX-LoRa.git
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
