<html>
   <head>
      <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
      <meta name="viewport" content="width=device-width,initial-scale=1.0">
      <title>QO-100 TX</title>
      <link rel="stylesheet" type="text/css" href="/css/bootstrap.min.css">
      <script src="/js/jquery-3.5.1.min.js"></script>
      <script src="/js/bootstrap.bundle.min.js"></script>
   </head>
   <body>
      <div class="d-flex justify-content-center m-md-5">
         <div class="card">
            <div class="card-header bg-dark text-white">
               <h1>QO-100 TX</h1>
            </div>
            <div class="card-body">
               <form id="form">
                  <label class="form-label" for="customFile">Update firmware</label>
                  <div class="d-grid gap-3">
                     <select class="form-select" id="target">
                        <option value="fw">Firmware (firmware.bin)</option>
                        <option value="fs">Web files (spiffs.bin)</option>
                     </select>
                     <input type="file" class="form-control" id="customFile" accept=".bin" />
                     <div class="progress">
                        <div class="progress-bar" role="progressbar" id="bar" style="width: 0px;"></div>
                     </div>
                     <div id="status"></div>
                  </div>
                  <div class="d-flex justify-content-center m-2">
                     <input type="submit" value="Update" class="btn btn-primary m-3" id="submit">
                  </div>
               </form>
               <script>
                  // No percent sign here: the page goes through the server template processor.
                  var PCT = String.fromCharCode(37);
                  document.getElementById('form').onsubmit = function (e) {
                     e.preventDefault();
                     var file = document.getElementById('customFile').files[0];
                     var status = document.getElementById('status');
                     var bar = document.getElementById('bar');
                     if (!file) { status.textContent = 'Choose a file first.'; return; }
                     var data = new FormData();
                     data.append('file', file, file.name);
                     var xhr = new XMLHttpRequest();
                     xhr.open('POST', '/ota?apikey=%APIKEY%&target=' + document.getElementById('target').value);
                     xhr.upload.onprogress = function (ev) {
                        if (ev.lengthComputable) {
                           var p = Math.round(ev.loaded * 100 / ev.total);
                           bar.style.width = p + PCT;
                           bar.textContent = p + PCT;
                        }
                     };
                     xhr.onload = function () {
                        status.textContent = xhr.responseText;
                        if (xhr.status == 200) {
                           status.textContent += ' - reloading in 10 s';
                           setTimeout(function () { window.location.href = '/?apikey=%APIKEY%'; }, 10000);
                        } else {
                           document.getElementById('submit').disabled = false;
                        }
                     };
                     xhr.onerror = function () {
                        status.textContent = 'Upload failed (connection error).';
                        document.getElementById('submit').disabled = false;
                     };
                     document.getElementById('submit').disabled = true;
                     status.textContent = 'Uploading, do not switch off...';
                     xhr.send(data);
                  };
               </script>
            </div>
         </div>
      </div>
      <footer class="d-flex justify-content-center m-5">
         &copy; OK1CDJ, OM2JU<a href="https://hamshop.cz" class="px-1">hamshop.cz</a>
      </footer>
   </body>
</html>
